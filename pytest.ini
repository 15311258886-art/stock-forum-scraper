[pytest]
# 规格书 A7：统一测试入口。一条命令跑全部：
#     .venv\Scripts\python.exe -m pytest -q
testpaths = . tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
# P2-37：单测硬超时，防挂死（需 pytest-timeout；未装则本项被忽略，不影响回归）
timeout = 120
# 采集时跳过与本项目正确性无关的重目录（第三方库 / 依赖 / 归档 / 运行产物）
norecursedirs = .venv node_modules extlib archive backups data tools artifacts shots qa_run reports .git __pycache__
# 老测试用 `return True/False` 而非 assert（历史写法），不视为错误
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
