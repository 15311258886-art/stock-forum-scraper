name: selfcheck-gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (仅标准库 + pytest；第三方按需，零强制新增依赖)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest || true

      - name: 阶段0 变异自检闸（非零即阻断合并）
        run: python stage0_selfcheck_gate.py

      - name: 阶段1 缺陷探针（存在硬缺陷则失败）
        run: python defect_probe.py

      - name: 阶段2/3/4 正确性测试（闸门/夹具Oracle/缺陷注册表，缺夹具诚实 skip）
        run: >-
          python -m pytest test_reasonableness_gate.py test_defect_probe.py
          test_fixtures_oracle.py test_stage0_correctness.py -q
