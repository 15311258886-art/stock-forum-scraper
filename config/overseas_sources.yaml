# 海外数据源注册表（美股 / 港股舆情监控 + 国外新闻驱动热点）
# ----------------------------------------------------------------------------
# 设计原则（重要）：
#   1) 以「国外渠道为主」：优先国外财经媒体 / 意见领袖 / 官方披露，国内源仅作交叉比对。
#   2) 每个源带 status 标注，界面会如实显示「已接入 / 待激活（需 VPN）/ 待激活（需 Key）」，
#      不会把抓不到的数据伪装成已抓到。
#   3) requires_vpn / requires_key = true 的源，本机实测被阻断或需凭据；
#      适配器已写好，一旦提供 Key 或连通 VPN，改 enabled: true 即可生效。
# ----------------------------------------------------------------------------

defaults:
  timeout: 15
  retry_max: 2
  rate_limit_per_min: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# 舆情监控模块的权重口径：国外源权重高于国内源（突出国外舆论视角）
region_weights:
  US: 1.00        # 美股 / 美国媒体 / 美国意见领袖
  HK: 0.85        # 港股 / 香港媒体
  GLOBAL: 0.80    # 国际通讯社 / 跨国议题（疫情、地缘）
  SG: 0.72        # 新加坡 / 东南亚视角（海外华人媒体）
  CN: 0.45        # 国内源：仅作交叉比对，权重压低

sources:
  # ============ 美股：国外财经媒体 / 博客评论（本机实测可达） ============
  - key: cnbc
    name: CNBC
    region: US
    market: [US]
    lang: en
    type: rss
    kind: media
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    enabled: true
    verified: true            # 本机实测 200，30 条
  - key: marketwatch
    name: MarketWatch
    region: US
    market: [US]
    lang: en
    type: rss
    kind: media
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    enabled: true
    verified: true            # 本机实测 200，10 条
  - key: seekingalpha
    name: Seeking Alpha
    region: US
    market: [US]
    lang: en
    type: rss
    kind: blog               # 博客评论 / 观点文章
    url: https://seekingalpha.com/market_currents.xml
    enabled: true
    verified: true            # 本机实测 200，7 条
  - key: yahoo_finance_rss
    name: Yahoo Finance
    region: US
    market: [US]
    lang: en
    type: rss
    kind: media
    url: https://finance.yahoo.com/news/rssindex
    enabled: false
    requires_vpn: true
    note: 本机实测 HTTP 403（需境外出口或授权），已留适配器
  - key: youtube_finance
    name: YouTube 财经大咖
    region: US
    market: [US, HK]
    lang: en
    type: youtube_api
    kind: influencer          # 意见领袖（测评 / 策略视频）
    enabled: false
    requires_key: true
    api_key_env: YOUTUBE_API_KEY
    api_key: ""               # 填自己的 YouTube Data API v3 Key 即生效
    queries: ["stock market analysis", "US stocks strategy", "HK stocks outlook",
              "fed rate decision", "semiconductor stocks"]
    max_results: 8
    note: "本机实测超时（被阻断）；且需 YouTube Data API v3 Key。适配器已实现，填 Key + 连通后 enabled: true 即生效"
  - key: reddit_stocks
    name: Reddit r/stocks
    region: US
    market: [US]
    lang: en
    type: reddit_json
    kind: forum                # 外媒/散户舆论场
    enabled: false
    requires_vpn: true
    subs: ["stocks", "wallstreetbets", "investing", "StockMarket"]
    note: 本机实测连接被重置（需 VPN），已留适配器

