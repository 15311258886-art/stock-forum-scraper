    rate_limit_per_min: 6
    extra_headers:
      Referer: https://guba.eastmoney.com/
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
      Accept-Language: zh-CN,zh;q=0.9
      Accept-Encoding: gzip, deflate, br
    register_url: ''
    login:
      auth_mode: none
      login_url: ''
      verify:
        url: ''
        must_contain: []
        must_not_contain: []
    list_url_tpl: https://guba.eastmoney.com/list,{symbol}.html
    # 2026-10-05（报告建议4）：东财股吧**没有公开选手排行榜**，parser 里 parse_players
    # 也是显式放弃的（会返回空）。下面 targets.players 留着只是为了抓取配置完整，
    # 实际不出选手榜数据 —— 选手池靠行为反推，前端会标「仅行为反推」。
    # 同理 player_page_tpl 不填（东财无稳定的个人持仓页），「持仓记录」以淘股吧为主源。
    target_symbols:
    - 600519
    - 1
    - 300750
    - 601318
    - 600036
    - 000858
    targets:
      news:
      - https://guba.eastmoney.com/list,600519.html
      - https://guba.eastmoney.com/list,000001.html
      - https://guba.eastmoney.com/list,300750.html
      - https://guba.eastmoney.com/list,601318.html
      trades:
      - https://guba.eastmoney.com/list,600519.html
      - https://guba.eastmoney.com/list,000001.html
      - https://guba.eastmoney.com/list,300750.html
      - https://guba.eastmoney.com/list,601318.html
      players:
      - https://guba.eastmoney.com/list,600519.html
