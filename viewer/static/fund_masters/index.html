<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>基金经理策略 · 查看器</title>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1F2933; --ink2:#4A5568; --ink3:#718096;
  --line:#E2E6EA; --teal:#0E7490; --teal-soft:#E6F2F5;
  --up:#C62828; --down:#2E7D32; --warn:#C05621; --warn-bg:#FFF6EE;
  --gold:#B8860B;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",Arial,sans-serif;
  line-height:1.6;font-size:14px;}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 60px;}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-bottom:3px solid var(--teal);padding-bottom:14px;margin-bottom:18px;}
.topbar h1{font-size:22px;margin:0;letter-spacing:.5px;}
.topbar .sub{color:var(--ink3);font-size:13px;}
.topbar .spacer{flex:1;}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;}
.btn:hover{background:var(--teal-soft);}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
.btn.primary:hover{background:#0b5e74;}
.btn.consensus{background:linear-gradient(135deg,#0E7490,#10B981);color:#fff;border:none;
  font-weight:700;font-size:15px;padding:11px 20px;box-shadow:0 2px 8px rgba(14,116,144,.25);}
.btn.consensus:hover{filter:brightness(1.06);}
.meta{color:var(--ink3);font-size:12px;margin-top:6px;}

/* 共识总入口卡 */
.consensus-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#0E7490,#10B981);
  color:#fff;border-radius:14px;padding:16px 20px;margin-bottom:18px;cursor:pointer;
  box-shadow:0 3px 12px rgba(14,116,144,.22);}
.consensus-hero:hover{filter:brightness(1.05);}
.consensus-hero .big{font-size:30px;font-weight:800;}
.consensus-hero .t{font-size:16px;font-weight:700;}
.consensus-hero .d{font-size:12.5px;opacity:.92;}

/* 分类框体 */
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:14px;}
.cat-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--teal);
  margin-bottom:10px;}
.cat-h .cnt{font-size:12px;color:var(--ink3);font-weight:400;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:7px 13px;border-radius:20px;cursor:pointer;font-size:13.5px;transition:.15s;}
.chip:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-soft);}
.chip.active{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
.chip .en{font-size:11px;opacity:.6;margin-left:5px;}

/* 详情区 */
.detail{margin-top:6px;}
.detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;}
.detail-head .nm{font-size:17px;font-weight:700;}
.detail-head .philo{color:var(--ink3);font-size:12.5px;flex:1;min-width:200px;}
.detail-head select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
#reportFrame{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff;}

/* 共识视图 */
.consensus-view{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.kpi{flex:1;min-width:140px;background:var(--teal-soft);border-radius:10px;padding:12px 14px;}
.kpi .n{font-size:26px;font-weight:800;color:var(--teal);}
.kpi .l{font-size:12.5px;color:var(--ink2);}
.filter{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.filter input[type=range]{width:240px;}
.cs-item{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.cs-item .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cs-item .code{font-family:Consolas,Menlo,monospace;color:var(--ink2);}
.cs-item .name{font-weight:700;font-size:15px;}
.cs-item .nbadge{background:var(--teal);color:#fff;border-radius:20px;padding:2px 11px;font-weight:700;font-size:13px;}
.cs-item .mgrs{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px dashed var(--line);}
.cs-item{cursor:pointer;transition:background .12s;}
.cs-item:hover{background:#F0F3F5;}
.mgr-link{cursor:pointer;}
.mgr-link:hover{background:var(--teal);color:#fff;}
.cs-item .mgr{font-size:11.5px;background:var(--teal-soft);color:var(--teal);border-radius:6px;padding:1px 8px;}

/* 需警惕 */
.warn-box{background:#FFF7F7;border:1px solid #F0C9C9;border-radius:12px;margin-top:18px;overflow:hidden;}
.warn-head{padding:12px 16px;cursor:pointer;font-weight:700;color:#B23B3B;display:flex;align-items:center;gap:8px;}
.warn-body{padding:0 16px 14px;display:none;}
.warn-body.open{display:block;}
.warn-person{border-top:1px solid #F3D9D9;padding:9px 0;}
.warn-person .pn{font-weight:700;color:var(--ink);}
.warn-person .pe{font-size:11.5px;color:var(--ink3);}
.warn-person .pr{font-size:13px;color:#8a4b4b;margin-top:2px;}

.note{background:var(--warn-bg);border-left:4px solid var(--warn);padding:10px 14px;
  font-size:12.5px;color:#5A3A18;border-radius:0 6px 6px 0;margin:10px 0;}
.back-link{color:var(--teal);cursor:pointer;text-decoration:underline;font-size:13px;}
.perf{margin-top:8px;padding:10px 12px;background:var(--teal-soft);border-radius:8px;}
.perf-tbl{border-collapse:collapse;width:100%;font-size:12.5px;}
.perf-tbl th{text-align:left;color:var(--ink2);font-weight:600;padding:4px 10px 4px 0;white-space:nowrap;}
.perf-tbl td{padding:4px 14px 4px 0;font-weight:600;white-space:nowrap;}

.hidden{display:none !important;}
.empty{padding:30px;text-align:center;color:var(--ink3);}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>📊 基金经理策略</h1>
      <div class="sub">27 位经理 · 按投资哲学本地量化筛选 A 股 · 点人名看研报</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnBack" onclick="showCats()">← 返回名单</button>
  </div>
  <div class="meta" id="metaLine"></div>

  <!-- 共识总入口（所有人名最前，并列关系） -->
  <div class="consensus-hero" id="consensusHero" onclick="showConsensus()">
    <div class="big">🤝</div>
    <div>
      <div class="t">共识筛选 · 多少经理共同选中了同一只票</div>
      <div class="d" id="heroDesc">点击查看被多位经理共同选出的标的，并可按「≥N 家共同选出」过滤</div>
    </div>
  </div>

  <!-- 分类框体 + 经理子标签 -->
  <div id="cats"></div>

  <!-- 经理详情（研报） -->
  <div class="detail hidden" id="detail">
    <div class="detail-head">
      <span class="nm" id="dName"></span>
      <span class="philo" id="dPhilo"></span>
      <select id="dHistory" onchange="loadReport(this.value)"></select>
      <button class="btn" onclick="showConsensus()">🤝 共识</button>
    </div>
    <iframe id="reportFrame" src="about:blank"></iframe>
  </div>

  <!-- 共识视图 -->
  <div class="consensus-view hidden" id="consensusView">
    <h2 style="margin:0 0 4px;color:var(--teal);font-size:18px;">🤝 共识筛选</h2>
    <div class="kpis" id="csKpis"></div>
    <div class="filter">
      <label>仅显示被 <b id="nLabel">2</b> 家及以上共同选出的标的：</label>
      <input type="range" id="nFilter" min="1" max="12" value="2" oninput="applyFilter()">
      <span class="note" style="margin:0;">同一只票被越多经理选中，代表越多策略因子共振；这是「多人同框」的硬筛选，不依赖单一经理主观判断。</span>
    </div>
    <div id="csList"></div>

    <hr style="border:none;border-top:1px dashed var(--line);margin:18px 0;">
    <h2 style="margin:0 0 4px;color:var(--teal);font-size:18px;">📜 共识回看 · 历史记录</h2>
    <div class="filter">
      <label>回看周次：</label>
      <select id="histWeek" onchange="renderHistory()"></select>
      <label style="margin-left:12px;">回看日期（可选，留空=最新）：</label>
      <input type="date" id="histAsOf" onchange="renderHistory()">
      <span class="note" style="margin:0;">每周共识筛选自动留底；切换周次看当周标的与「标注日」，可选回看日期评估表现。</span>
    </div>
    <div id="histList"></div>
  </div>

  <!-- 需警惕人物 -->
  <div class="warn-box">
    <div class="warn-head" onclick="toggleWarn()">⚠️ 需警惕人物（点击展开 / 收起）</div>
    <div class="warn-body" id="warnBody"></div>
  </div>

</div>

<script>
let DATA = null;
let activeKey = null;

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

fetch('index.json',{cache:'no-store'})
  .then(r=>r.json()).then(d=>{DATA=d;render();})
  .catch(e=>{document.getElementById('cats').innerHTML='<div class="empty">加载 index.json 失败：'+esc(e)+'</div>';});

function render(){
  document.getElementById('metaLine').textContent =
    '数据基准日 '+esc(DATA.basis_date)+' · 筛选覆盖池 '+DATA.universe_n+
    ' 只（四支柱基本面表）· 生成于 '+esc(DATA.generated_at)+
    (DATA.do_enrich?' · 估值已联网补全':' · 估值未补全（离线预览）');

  const cats = document.getElementById('cats');
  cats.innerHTML = DATA.categories.map(c=>{
    const ms = c.managers.map(k=>{
      const m = DATA.managers[k];
      const cnt = m.counts.total;
      return '<span class="chip" data-k="'+k+'" onclick="openManager(\''+k+'\')">'
        +esc(m.cn)+'<span class="en">'+esc(m.en)+'</span></span>';
    }).join('');
    return '<div class="cat"><div class="cat-h">'+esc(c.label)+
      ' <span class="cnt">'+c.managers.length+' 人</span></div><div class="chips">'+ms+'</div></div>';
  }).join('');

  // 共识 hero 描述
  const ranked = DATA.consensus.ranked;
  const ge2 = ranked.filter(c=>c.n>=2).length;
  const maxn = ranked.length?ranked[0].n:0;
  document.getElementById('heroDesc').textContent =
    '共 '+ranked.length+' 只被共同选中；其中 '+ge2+' 只被 ≥2 家共同选出，最高一只被 '+maxn+' 家共同选中。点击进入可按「≥N 家」过滤。';

  // 需警惕
  document.getElementById('warnBody').innerHTML = DATA.warning.people.map(p=>
    '<div class="warn-person"><div class="pn">'+esc(p.cn)+
    ' <span class="pe">'+esc(p.en)+'</span></div><div class="pr">'+esc(p.reason)+'</div></div>'
  ).join('');
}

function showCats(){
  document.getElementById('cats').classList.remove('hidden');
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('consensusView').classList.add('hidden');
  document.getElementById('consensusHero').classList.remove('hidden');
  activeKey=null;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
}
function openManager(k){
  activeKey=k;
  const m=DATA.managers[k];
  document.getElementById('cats').classList.add('hidden');
  document.getElementById('consensusView').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('consensusHero').classList.add('hidden');
  document.getElementById('dName').textContent=m.cn+' · '+m.en;
  document.getElementById('dPhilo').textContent=m.philosophy;
  const sel=document.getElementById('dHistory');
  sel.innerHTML=m.history.map(h=>{
    const pd=h.replace('.html','');
    return '<option value="'+esc(m.latest.split('/')[0]+'/'+h)+'">'+pd+'</option>';
  }).reverse().join('');
  sel.value=m.latest;
  loadReport(m.latest);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.k===k));
}
function loadReport(rel){
  document.getElementById('reportFrame').src='reports/'+rel;
}

function showConsensus(){
  document.getElementById('cats').classList.add('hidden');
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('consensusView').classList.remove('hidden');
  document.getElementById('consensusHero').classList.add('hidden');
  renderConsensus();
}
function renderConsensus(){
  const ranked=DATA.consensus.ranked;
  document.getElementById('csKpis').innerHTML =
    '<div class="kpi"><div class="n">'+ranked.length+'</div><div class="l">被共同选中的标的数</div></div>'+
    '<div class="kpi"><div class="n">'+ranked.filter(c=>c.n>=2).length+'</div><div class="l">被 ≥2 家共同选中</div></div>'+
    '<div class="kpi"><div class="n">'+(ranked.length?ranked[0].n:0)+'</div><div class="l">单只最高被选中家数</div></div>';
  applyFilter();
  renderHistory();
}
function applyFilter(){
  const n=+document.getElementById('nFilter').value;
  document.getElementById('nLabel').textContent=n;
  const ranked=DATA.consensus.ranked.filter(c=>c.n>=n);
  const list=document.getElementById('csList');
  if(!ranked.length){list.innerHTML='<div class="empty">没有标的被 ≥'+n+' 家共同选中。</div>';return;}
  list.innerHTML=ranked.map(c=>{
    const mgrChips=c.managers.map(k=>
      '<span class="mgr mgr-link" data-k="'+esc(k)+'" title="查看 '+esc(DATA.managers[k].cn)+' 的研报">'+esc(DATA.managers[k].cn)+'</span>'
    ).join('');
    return '<div class="cs-item" data-code="'+esc(c.code)+'" title="点击查看个股详情（K线）"><div class="row1">'+
      '<span class="code">'+esc(c.code)+'</span>'+
      '<span class="name">'+esc(c.name)+'</span>'+
      '<span class="nbadge">'+c.n+' 家共同选中</span></div>'+
      '<div class="mgrs">'+mgrChips+'</div></div>';
  }).join('');
  list.querySelectorAll('.cs-item').forEach(el=>{
    el.addEventListener('click',()=>{
      try{ parent.postMessage({type:'fm-open-stock', symbol:el.getAttribute('data-code')}, '*'); }catch(err){}
    });
  });
  list.querySelectorAll('.mgr-link').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); openManager(el.getAttribute('data-k')); });
  });
}
// ===== 共识回看·历史记录（2026-10-20）=====
let HIST = {manifest:null, cache:{}};

function renderHistory(){
  const list=document.getElementById('histList');
  if(!HIST.manifest){
    fetch('snapshots/index.json',{cache:'no-store'})
      .then(r=>{ if(!r.ok) throw new Error('尚未生成快照'); return r.json(); })
      .then(m=>{ HIST.manifest=m; fillHistWeek(); doRenderHistory(); })
      .catch(e=>{ list.innerHTML='<div class="empty">尚无历史快照：'+esc(e)+'（首次访问 index.json 会自动留底，请稍后刷新本栏重试）。</div>'; });
    return;
  }
  doRenderHistory();
}
function fillHistWeek(){
  const sel=document.getElementById('histWeek');
  const m=HIST.manifest||[];
  sel.innerHTML=m.map(s=>'<option value="'+esc(s.basis_date)+'">'+esc(s.basis_date)+(s.consensus_n!=null?' · '+s.consensus_n+' 只':'')+'</option>').join('');
  if(m.length) sel.value=m[m.length-1].basis_date; // 默认最新周
}
function doRenderHistory(){
  HIST.cache={}; // 周次/回看日期变化后作废已展开的行情缓存
  const sel=document.getElementById('histWeek');
  const list=document.getElementById('histList');
  const bd=sel.value;
  if(!bd){ list.innerHTML='<div class="empty">暂无可回看的周次。</div>'; return; }
  const item=HIST.manifest.find(s=>s.basis_date===bd);
  const file=(item&&item.file)?item.file:(bd+'.json');
  fetch('snapshots/'+file,{cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('快照读取失败'); return r.json(); })
    .then(d=>renderHistList(d, bd))
    .catch(e=>{ list.innerHTML='<div class="empty">读取周次快照失败：'+esc(e)+'</div>'; });
}
function renderHistList(d, bd){
  const list=document.getElementById('histList');
  const ranked=(d.consensus&&d.consensus.ranked)||[];
  if(!ranked.length){ list.innerHTML='<div class="empty">该周次无共识标的。</div>'; return; }
  list.innerHTML=ranked.map(c=>{
    const mgrChips=(c.managers||[]).map(k=>{
      const mn=(d.managers&&d.managers[k])?d.managers[k].cn:k;
      return '<span class="mgr mgr-link" data-k="'+esc(k)+'" title="查看 '+esc(mn)+' 的研报">'+esc(mn)+'</span>';
    }).join('');
    return '<div class="cs-item" data-code="'+esc(c.code)+'">'+
      '<div class="row1">'+
        '<span class="code">'+esc(c.code)+'</span>'+
        '<span class="name">'+esc(c.name)+'</span>'+
        '<span class="nbadge">'+c.n+' 家共同选中</span>'+
        '<span style="margin-left:auto;color:var(--ink3);font-size:12px;">标注日 '+esc(bd)+'</span>'+
        '<button class="btn perf-btn" data-code="'+esc(c.code)+'" data-bd="'+esc(bd)+'" style="padding:4px 10px;font-size:12px;">▸ 表现</button>'+
        '<button class="btn kline-btn" data-code="'+esc(c.code)+'" style="padding:4px 10px;font-size:12px;" title="打开个股详情（K线）">📈 K线</button>'+
      '</div>'+
      '<div class="mgrs">'+mgrChips+'</div>'+
      '<div class="perf hidden" id="perf-'+esc(c.code)+'-'+esc(bd)+'"></div>'+
    '</div>';
  }).join('');
  list.querySelectorAll('.mgr-link').forEach(el=>{ el.addEventListener('click',(e)=>{ e.stopPropagation(); openManager(el.getAttribute('data-k')); }); });
  list.querySelectorAll('.perf-btn').forEach(el=>{ el.addEventListener('click',(e)=>{ e.stopPropagation(); togglePerf(e, el.getAttribute('data-code'), el.getAttribute('data-bd')); }); });
  list.querySelectorAll('.kline-btn').forEach(el=>{ el.addEventListener('click',(e)=>{ e.stopPropagation(); try{ parent.postMessage({type:'fm-open-stock',symbol:el.getAttribute('data-code')},'*'); }catch(err){} }); });
}
function togglePerf(ev, code, bd){
  const box=document.getElementById('perf-'+code+'-'+bd);
  if(!box) return;
  const btn=ev.currentTarget;
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); if(btn) btn.textContent='▸ 表现'; return; }
  if(HIST.cache[code+'-'+bd]){ box.innerHTML=HIST.cache[code+'-'+bd]; box.classList.remove('hidden'); if(btn) btn.textContent='▾ 表现'; return; }
  box.classList.remove('hidden');
  box.innerHTML='<div class="empty" style="padding:12px;">正在获取行情…</div>';
  fetch('/api/kline?symbol='+encodeURIComponent(code)+'&full=1',{cache:'no-store'})
    .then(r=>r.json()).then(d=>{
      const html=buildPerfHtml(d, bd, document.getElementById('histAsOf').value);
      HIST.cache[code+'-'+bd]=html;
      box.innerHTML=html;
      if(btn) btn.textContent='▾ 表现';
    }).catch(e=>{ box.innerHTML='<div class="empty">行情获取失败：'+esc(e)+'</div>'; });
}
function buildPerfHtml(d, bd, asOf){
  const kl=(d&&d.klines)||[];
  if(!kl.length) return '<div class="empty">无行情数据。</div>';
  kl.sort((a,b)=>String(a.date).localeCompare(String(b.date))); // 升序
  const find=(dt)=>{ let best=null; for(const k of kl){ if(String(k.date)<=String(dt)) best=k; else break; } return best; };
  const basis=find(bd);
  if(!basis) return '<div class="empty">标注日 '+esc(bd)+' 早于行情起始（'+esc(kl[0].date)+'），无法计算。</div>';
  const bi=kl.indexOf(basis);
  let refK, refLabel;
  if(asOf){ const ak=find(asOf); if(ak){ refK=ak; refLabel=ak.date; } else { refK=kl[kl.length-1]; refLabel=refK.date+'(最新)'; } }
  else { refK=kl[kl.length-1]; refLabel=refK.date; }
  const pct=(refK.close/basis.close-1)*100;
  const tcol=(v)=> v>=0?'var(--up)':'var(--down)';
  const tn=(v)=> (v>=0?'+':'')+v.toFixed(2)+'%';
  const trow=(n)=>{ const k=kl[bi+n]; if(!k) return '<td style="color:var(--ink3)">N/A</td>'; const v=(k.close/basis.close-1)*100; return '<td style="color:'+tcol(v)+';font-weight:600;">'+tn(v)+'</td>'; };
  return '<table class="perf-tbl">'+
    '<tr><th>标注日收盘</th><td>'+basis.close.toFixed(2)+' <span style="color:var(--ink3)">('+basis.date+')</span></td>'+
    '<th>回看日收盘</th><td>'+refK.close.toFixed(2)+' <span style="color:var(--ink3)">('+refLabel+')</span></td>'+
    '<th>标注日→回看日</th><td style="color:'+tcol(pct)+';font-weight:700;">'+tn(pct)+'</td></tr>'+
    '<tr><th>T+1</th>'+trow(1)+'<th>T+3</th>'+trow(3)+'<th>T+5</th>'+trow(5)+'<th>T+10</th>'+trow(10)+'</tr>'+
    '</table>';
}

function toggleWarn(){
  document.getElementById('warnBody').classList.toggle('open');
}
</script>
