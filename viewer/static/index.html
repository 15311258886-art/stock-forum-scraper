<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 前端版本号唯一真源：/api/version 从这里解析；改 app.js/app.css 必须跟着加（见文件末尾脚注） -->
  <meta name="app-version" content="20261012-remed" />
  <title>股票讨论实时查看器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
  <link id="theme-link" rel="stylesheet" href="static/themes/light-tech.css" />
  <link rel="stylesheet" href="static/app.css?v=20261012-remed" />
  <link rel="stylesheet" href="static/visual-upgrade.css" />
  <link rel="stylesheet" href="static/bili_methods.css?v=20261012-biliconsensus" />
  <link rel="stylesheet" href="static/industry_leaders.css?v=20260922-il1" />
</head>
<body>
  <!-- 全局操作栏（2026-09-23 合并）：原先「顶栏 64px + 独立刷新状态条 43px」两行共占首屏 107px，
       且刷新状态与「立即刷新」按钮分处两地。现把刷新状态/倒计时/手动刷新并入顶栏同一行，
       首屏多还约 50px 给正文。元素 id 全部保留（rsDot / rsText / rsCountdown / btnRefreshNow），
       故 renderRefreshBar() 与 refreshNow() 无需任何改动。 -->
  <div class="topbar">
    <h1>📊 股票讨论实时查看器</h1>
    <div class="theme-pick" id="themePick" title="一键切换 UI 方案"></div>
    <span class="tb-sep"></span>
    <span class="rb-item" title="最近一次成功刷新与下次自动刷新时刻">
      <span class="rs-dot rs-never" id="rsDot"></span><span id="rsText">尚未刷新</span>
    </span>
    <span class="rb-cd" id="rsCountdown">自动刷新：未开启</span>
    <div class="spacer"></div>
    <!-- 顶栏控件分三组（2026-09-29 按职责重排+补悬停说明）：
         ① 数据抓取（管"数据新不新"）：实时刷新 / 自动调度 + 调度状态牌
         ② 页面刷新（管"页面新不新"）：盘中轮询开关 + 状态牌（状态牌也可点击开关）
         ③ 手动操作：登录检测 / 立即刷新 / 刷新海外舆情 / 抓取并更新 -->
    <label class="switch" title="数据抓取：勾选后每 5 分钟自动抓一次新数据（淘股吧+东财），对应左侧红点倒计时"><input type="checkbox" id="realtime" /> 实时刷新(5分钟)</label>
    <label class="switch" title="数据抓取：工作日 9:00-16:00 每约 10 分钟后台自动抓取淘股吧+东财，无需开页面"><input type="checkbox" id="schedAuto" /> 自动调度</label>
    <span class="rb-sched" id="schedText" title="「自动调度」的运行状态（只读显示，开关在上面那个复选框）">📡 调度状态：加载中…</span>
    <span class="tb-sep"></span>
    <label class="switch" title="页面刷新：交易时段(9:30-11:30/13:00-15:00)内每 60 秒自动重刷「当前看到的板块」页面；不动后台抓取"><input type="checkbox" id="pagePoll" /> 盘中轮询(60秒)</label>
    <span class="rb-poll" id="pagePollState" title="「盘中轮询」的状态牌，点一下也可开/关（与左边复选框等效）">盘中轮询：关闭</span>
    <span class="tb-sep"></span>
    <button class="btn sm" id="btnLogin" title="检测淘股吧登录凭据是否有效">登录检测</button>
    <button class="btn sm" id="btnRefreshNow" title="手动：立即抓一次新数据并刷新全部面板（按钮会临时变成「刷新中…」）">立即刷新</button>
    <button class="btn" id="btnOverseas" title="手动：抓取海外舆情数据并刷新对应面板">刷新海外舆情</button>
    <button class="btn primary" id="btnFetch" title="手动：立即抓取淘股吧+东财新数据，入库并刷新全部面板（按钮会临时变成「抓取中…」）">抓取并更新</button>
  </div>

  <!-- 应用外壳（2026-09-23 布局改造）：左侧一列竖向导航**贴住视口最左缘**（不再被居中容器含住），
       右侧内容区满宽铺开。
       导航采用**两级分工**（2026-09-23 晚回调）：左栏只放几个大类（稳定、不跳动、一眼看全），
       子类回到内容区顶部以**横向平铺**方式逐个点选 —— 与以往的使用习惯一致。
       两级结构仍由 app.js 的 NAV 配置单一来源生成，面板容器 .panel 保持原样不动。
       2026-09-26：大类由 5 个并为 4 个（「知识获取」+「跟我学习」合并为「学习中心」）。 -->
  <div class="shell">
    <aside class="sidenav" id="sidenav" aria-label="主导航"></aside>

    <div class="content">
      <div class="hint hint-slim" id="statusHint" role="status" aria-live="polite">顶栏开关分两类：实时刷新 / 自动调度 管「数据抓取」（往库里进新数据）；盘中轮询 管「页面刷新」（交易时段每 60 秒自动重刷当前板块，点右侧状态牌也能开关）。鼠标停在任何控件上都有说明。</div>

      <div class="cards" id="cards"></div>

      <!-- 二级导航：当前大类下的子板块，横向平铺逐个点选（由 app.js paintSubnav() 绘制） -->
      <nav class="subnav" id="subnav" aria-label="子导航"></nav>

      <!-- 今日决策（2026-10-12 体验审计 P0-A）：新的默认落地页 —— 一屏四卡（方向/机会/风险/我的票）
           + 一句话结论，数据来自 /api/today_decision（复用既有口径，不新造引擎）。 -->
      <div class="panel" id="p-today"></div>
      <!-- 三个「结论页」（2026-10-12 体验审计 P0-D/E/F）：各自大类下的首个置顶子页 -->
      <div class="panel" id="p-info_brief"></div>
      <div class="panel" id="p-smart_money"></div>
      <div class="panel" id="p-watch_brief"></div>
      <div class="panel active" id="p-summary"></div>
      <div class="panel" id="p-dashboard"></div>
      <div class="panel" id="p-stocks"></div>
      <div class="panel" id="p-operating"></div>
      <div class="panel" id="p-players"></div>
      <!-- 游资龙虎榜（2026-09-25 补）：原先漏了这个静态面板，
           导致 loadAll() 里 renderLhb() 找不到 #p-lhb 直接 return，
           切到该标签时只创建空壳 div、无人再渲染 → 表现为「点开什么内容都没有」 -->
      <div class="panel" id="p-lhb"></div>
      <!-- 板块动向（2026-09-25 新增）：龙虎榜的「资金去哪条链」视角，与个股榜物理独立 -->
      <div class="panel" id="p-lhb_sectors"></div>
      <div class="panel" id="p-niusan"></div>
        <div class="panel" id="p-consensus"></div>
      <!-- 近5日共同买入（Request F）：与「共同持仓共识」并列的独立板块。
           两者口径不同——共识看「现在还持有」，本板块看「最近几天谁同时动手」 -->
      <div class="panel" id="p-cohold"></div>
      <div class="panel" id="p-persons"></div>
      <div class="panel" id="p-sentiment"></div>
      <div class="panel" id="p-topics"></div>
      <div class="panel" id="p-overseas_sentiment"></div>
      <div class="panel" id="p-overseas_hotspots"></div>
      <div class="panel" id="p-geo_events"></div>
      <!-- 全球政策雷达（2026-09-27 新增）：国际局势下「别国政策/内政」独立面板 -->
      <div class="panel" id="p-geo_policy"></div>
      <!-- 科技前沿突破（2026-09-27 新增）：国际局势下「科技新突破」独立面板 -->
      <div class="panel" id="p-geo_tech"></div>
      <div class="panel" id="p-extref_soft"></div>
      <div class="panel" id="p-extref_comm"></div>
      <div class="panel" id="p-extref_rank"></div>
      <!-- 自选池（2026-09-27 新增）：关注池（可分组/改名/标目标价）+ 到价提醒。
           数据来自独立模块 watchlib.py（表 watch_*，零 JOIN 既有业务表）。 -->
      <div class="panel" id="p-watch"></div>
      <div class="panel" id="p-watch_alerts"></div>
      <!-- 增强功能（2026-09-27 新增，隔离增量）：智能选股/资金流向/估值诊股/研报评级/多资产/资讯公告。
           数据来自独立模块（emapi + moneyflow/screener/valuation/research/multiquote/newsfeed），
           零 JOIN 既有业务表，渲染层零改动。 -->
      <div class="panel" id="p-screener"></div>
      <!-- 入手概率（2026-10-05 王总需求从智能选股里单独立出）：上半=全市场入手概率榜（7 级档位 +
           场景/五维/动作三段描述），下半=时间轴（各归档日的 T+1/3/5/10 入市价 → 后来收盘价比值）。
           与「智能选股·连续阴跌」并列，共用 screener 的换手率五维评分引擎（不另起一套口径）。 -->
      <div class="panel" id="p-rate"></div>
      <div class="panel" id="p-moneyflow"></div>
      <!-- 个股诊断（2026-09-29 合并「估值诊股 + 个股资金流 + 财务/公告/专家分析」为一页；原 p-valuation 容器已并入此页） -->
      <div class="panel" id="p-diag"></div>
      <div class="panel" id="p-research"></div>
      <!-- 博主荐股 / 当红参赛股（2026-10-01 新增）：别人怎么看 下的两个子板块 -->
      <div class="panel" id="p-blogger"></div>
      <div class="panel" id="p-contest"></div>
      <div class="panel" id="p-multiquote"></div>
      <div class="panel" id="p-news"></div>
      <!-- 抓取管道：数据源 / 原始存档 / 抓取与登录记录。
           2026-09-26 起这三项已从导航撤下（看盘时无用），容器与渲染函数一并保留 ——
           加回 app.js 的 NAV.learn.items 即可原样复原，不必重接线。 -->
      <div class="panel" id="p-sources"></div>
      <div class="panel" id="p-archive"></div>
      <div class="panel" id="p-fetchlog"></div>
      <!-- 学习中心：知识库子板块按 config/kb_sources.yaml 动态生成（轨道排在前、按 order 排序） -->
      <div class="panel" id="p-learn_zdx_stock"></div>
      <div class="panel" id="p-learn_tracks"></div>
      <!-- 策略回测（2026-09-26 新增）：三栏视图（左=清单 / 中=长周期排名 / 右=近半年·近一年双窗口） -->
      <div class="panel" id="p-strategy_lab"></div>
      <!-- 行业龙头全景（2026-10-08 王总拍板）：申万一级行业 × 每行业总市值 Top5，头部标 `*`，全市场一目了然。
           后端 industry_leaders.py（真实市值驱动，沙箱 akshare 被代理拦则 available:False 诚实提示），
           前端 industry_leaders.js（window.loadIndustryLeaders），进入即懒加载（app.js selectNav 末尾）。 -->
      <div class="panel" id="p-industry-leaders"></div>
      <!-- 2026-10-11 王总第三回合：B站视频级分堆三大面板容器 -->
      <!-- ① 市场情绪：挂在「消息与外围」下，cat=sentiment（3865 条） -->
      <div class="panel" id="p-bili_sentiment"></div>
      <!-- ② B站博主：按类分组框（价值/技术/情绪主播），点名开该人知识沉淀；挂在「复盘成长」下 -->
      <div class="panel" id="p-bili_authors"></div>
      <!-- ③ 技术·价值教学：cat=technical,value（3306+397 条）；挂在「复盘成长」下 -->
      <div class="panel" id="p-bili_techvalue"></div>
    </div>
  </div>


  <!-- 详情面板：浮动窗口（可拖拽移动 / 右下角拉伸 / 多入口关闭） -->
  <div class="drawer-mask" id="mask"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="false" aria-hidden="true">
    <div class="drawer-head" id="drawerHead" title="按住此处拖动窗口">
      <span class="drawer-title" id="drawerTitle">详情</span>
      <div class="drawer-tools">
        <button class="dbtn" id="btnValuation" title="把当前股票送入「我的票 → 估值诊股」并自动评分（保留最近 20 条记录）" hidden>估值诊股</button>
        <button class="dbtn" id="btnAddWatch" title="把当前股票加入自选池" hidden>＋加入自选池</button>
        <button class="dbtn" id="btnGhost" title="半透明：可透看被遮挡的表格内容">半透明</button>
        <button class="dbtn" id="btnDim" title="遮罩：压暗背景作视觉分隔（背景仍可操作）">遮罩</button>
        <button class="dbtn" id="btnMax" title="最大化 / 还原">⛶</button>
        <button class="dbtn close" id="btnClose" title="关闭（Esc）">✕</button>
      </div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot">
      <span id="drawerTip">拖标题栏 ⋮⋮ 移动 · 右下角 ↘ 拉伸缩放 · ⛶ 最大化 · 半透明 · Esc 关闭</span>
      <button class="btn sm" id="btnClose2">关闭</button>
    </div>
    <div class="drawer-resize" id="drawerResize" title="拖拽调整大小"></div>
  </div>

  <!-- 新闻/公告分类规则：由 viewer/newsclass.py（唯一真源）在服务启动时重写出这份文件；改词表只改 py 再重启 -->
  <script src="static/news_rules.js?v=20261007-fast"></script>
  <script src="static/app.js?v=20261012-remed"></script>
  <script src="static/screener_extra.js?v=20261007-b125"></script>
  <script src="static/industry_leaders.js?v=20261008-il1"></script>
  <!-- 版本号串：改 app.js/app.css 后必须跟着加，否则王总桌面页面走缓存看不到新文案（2026-10-01 踩过）。
       另外页面每 60s 会跟 /api/version 比一次版本：不一致就在顶部弹「界面已更新，点此刷新」提示条，
       解决「后端改了、旧窗口里的旧 JS 还在跑、王总说看不到新功能」这一类问题。 -->
</body>
</html>
